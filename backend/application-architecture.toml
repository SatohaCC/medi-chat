enforced_features = ["package_insert_import", "file_upload", "medicine", "indexing", "retrieval", "chat", "authentication"]

[features.authentication]
depends_on = []
public_modules = ["commands.login", "commands.logout", "commands.refresh", "commands.manage_users", "commands.models", "queries.authenticate", "errors"]

# Explicit feature dependencies and public module contracts. No per-violation ignores.
[features.package_insert_import]
depends_on = ["file_upload"]
public_modules = ["commands.models", "queries.dtos.import_views", "queries.import_history", "interfaces.import_replay", "errors", "policies", "commands.import_documents", "interfaces.original_document_registration", "interfaces.import_query_reader", "interfaces.upload_import_receipts", "interfaces.import_execution"]

[features.file_upload]
depends_on = []
public_modules = ["commands.models", "errors", "commands.services.start_upload", "commands.services.upload_part", "commands.services.complete_upload", "interfaces.temporary_file_store"]

[features.chat]
depends_on = ["retrieval", "medicine", "indexing"]
public_modules = ["queries.models", "queries.chat", "interfaces.llm_provider", "interfaces.agent_orchestrator", "interfaces.medical_tool", "queries.policies.standard", "queries.policies.answer_prompt", "queries.services.stream_lifetime", "queries.services.package_insert_tools", "commands.submit_feedback", "interfaces.feedback", "values", "errors"]

[features.retrieval]
depends_on = ["medicine", "indexing"]
public_modules = ["queries.models", "values", "queries.policies.selection", "queries.policies.standard", "queries.policies.section_titles", "queries.dtos.evidence", "queries.services.evidence_retrieval", "queries.services.retrieval_session", "queries.services.intent_detection", "queries.services.keyword_detection", "queries.services.keyword_search", "interfaces.evidence_query_reader", "interfaces.intent_classifier", "interfaces.keyword_extractor", "interfaces.keyword_expander", "interfaces.snapshot_provider"]

[features.indexing]
depends_on = ["medicine"]
public_modules = ["queries.models", "values", "queries.policies.text_projection", "queries.services.package_insert_projection"]

[features.medicine]
depends_on = []
public_modules = ["queries.models", "values", "errors", "queries.catalog", "queries.policies.catalog_matching", "interfaces.medicine_query_reader", "queries.suggest_medicines"]
