[project]
name = "medi-chat-backend"
version = "0.2.0"
description = "PMDA package inserts search and AI real-time streaming chat."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.17,<2",
    "fastapi[standard]>=0.115.0",
    "google-genai>=1.0.0",
    "janome>=0.5.0",
    "openai>=1.50.0",
    "psutil>=7.2,<8",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0,<3",
    "typesafe-sdk>=0.7.2",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]

[tool.importlinter]
root_package = "backend"

[[tool.importlinter.contracts]]
name = "Domain does not depend on outer layers"
type = "forbidden"
source_modules = [
    "backend.domain",
    "backend.domain.**",
]
forbidden_modules = [
    "backend.application",
    "backend.application.**",
    "backend.infrastructure",
    "backend.infrastructure.**",
    "backend.presentation",
    "backend.presentation.**",
    "backend.config",
    "backend.config.**",
    "backend.migrations",
    "backend.migrations.**",
    "backend.main",
]
as_packages = false

[[tool.importlinter.contracts]]
name = "Application does not depend on outer layers"
type = "forbidden"
source_modules = [
    "backend.application",
    "backend.application.**",
]
forbidden_modules = [
    "backend.infrastructure",
    "backend.infrastructure.**",
    "backend.presentation",
    "backend.presentation.**",
    "backend.config",
    "backend.config.**",
    "backend.migrations",
    "backend.migrations.**",
    "backend.main",
]
as_packages = false

[[tool.importlinter.contracts]]
name = "Presentation does not depend on infrastructure"
type = "forbidden"
source_modules = [
    "backend.presentation",
    "backend.presentation.**",
]
forbidden_modules = [
    "backend.infrastructure",
    "backend.infrastructure.**",
    "backend.migrations",
    "backend.migrations.**",
    "backend.main",
]
as_packages = false

[[tool.importlinter.contracts]]
name = "Infrastructure does not depend on presentation"
type = "forbidden"
source_modules = [
    "backend.infrastructure",
    "backend.infrastructure.**",
]
forbidden_modules = [
    "backend.presentation",
    "backend.presentation.**",
    "backend.main",
]
as_packages = false
ignore_imports = [
    "backend.infrastructure.composition.configured_probe -> backend.main",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Config does not depend on layers"
type = "forbidden"
source_modules = [
    "backend.config",
    "backend.config.**",
]
forbidden_modules = [
    "backend.domain",
    "backend.domain.**",
    "backend.application",
    "backend.application.**",
    "backend.infrastructure",
    "backend.infrastructure.**",
    "backend.presentation",
    "backend.presentation.**",
    "backend.migrations",
    "backend.migrations.**",
    "backend.main",
]
as_packages = false

[[tool.importlinter.contracts]]
name = "Presentation does not directly depend on domain entities or services"
type = "forbidden"
source_modules = [
    "backend.presentation",
    "backend.presentation.**",
]
forbidden_modules = [
    "backend.domain.*.entities",
    "backend.domain.*.services",
]
as_packages = false
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Presentation routes and dependencies do not depend on domain models or repositories"
type = "forbidden"
source_modules = [
    "backend.presentation",
    "backend.presentation.**",
]
forbidden_modules = [
    "backend.domain",
    "backend.domain.**",
]
as_packages = false
allow_indirect_imports = true
ignore_imports = [
    "backend.presentation.attachment_import_routes -> backend.domain.foundation.exceptions",
    "backend.presentation.chat_dto_mapper -> backend.domain.*.*",
    "backend.presentation.chat_service -> backend.domain.*.*",
    "backend.presentation.evidence_models -> backend.domain.*.*",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Non-chat application contexts do not depend on chat"
type = "forbidden"
source_modules = ["backend.application.*"]
forbidden_modules = ["backend.application.chat"]

[[tool.importlinter.contracts]]
name = "Medicine catalogue does not depend on retrieval use cases"
type = "forbidden"
source_modules = ["backend.application.medicine"]
forbidden_modules = ["backend.application.*"]

[[tool.importlinter.contracts]]
name = "Application contexts follow directed pipeline boundaries"
type = "independence"
modules = ["backend.application.*"]
ignore_imports = [
    "backend.application.chat.** -> backend.application.retrieval.**",
    "backend.application.chat.** -> backend.application.medicine.**",
    "backend.application.retrieval.** -> backend.application.medicine.**",
    "backend.application.attachment_import.** -> backend.application.indexing.**",
    "backend.application.indexing.** -> backend.application.medicine.**",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Persistence does not depend on input sources"
type = "forbidden"
source_modules = ["backend.infrastructure.persistence"]
forbidden_modules = ["backend.infrastructure.sources"]

[[tool.importlinter.contracts]]
name = "Infrastructure adapters do not depend on composition or CLI"
type = "forbidden"
source_modules = ["backend.infrastructure.*"]
forbidden_modules = [
    "backend.infrastructure.composition",
    "backend.infrastructure.cli",
]
ignore_imports = [
    "backend.infrastructure.cli.** -> backend.infrastructure.composition.**",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "External technology adapters are independent"
type = "independence"
modules = [
    "backend.infrastructure.llm",
    "backend.infrastructure.intent",
    "backend.infrastructure.morphology",
    "backend.infrastructure.pmda_xml",
]
ignore_imports = [
    "backend.infrastructure.** -> backend.infrastructure.package_insert_definitions.**",
    "backend.infrastructure.package_insert_definitions.loader -> backend.infrastructure.*.definition_settings",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Domain contexts are independent"
type = "independence"
modules = ["backend.domain.*"]
ignore_imports = [
    "backend.domain.** -> backend.domain.foundation",
    "backend.domain.** -> backend.domain.foundation.**",
    "backend.domain.** -> backend.domain.shared",
    "backend.domain.** -> backend.domain.shared.**",
    "backend.domain.** -> backend.domain.json_types",
    "backend.domain.** -> backend.domain.*.identifiers",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Foundation does not depend on business vocabulary"
type = "forbidden"
source_modules = ["backend.domain.foundation"]
forbidden_modules = ["backend.domain.*"]
ignore_imports = ["backend.domain.foundation.** -> backend.domain.json_types"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Shared does not depend on business contexts"
type = "forbidden"
source_modules = ["backend.domain.shared"]
forbidden_modules = ["backend.domain.*"]
ignore_imports = [
    "backend.domain.shared.** -> backend.domain.foundation",
    "backend.domain.shared.** -> backend.domain.foundation.**",
    "backend.domain.shared.** -> backend.domain.json_types",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Public identifiers do not expose business implementation"
type = "forbidden"
source_modules = ["backend.domain.*.identifiers"]
forbidden_modules = ["backend.**"]
as_packages = false
ignore_imports = [
    "backend.domain.*.identifiers -> backend.domain.foundation.primitives.identifiers",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Domain primitives do not depend on value objects, entities, repositories, or services"
type = "forbidden"
source_modules = ["backend.domain.*.primitives", "backend.domain.*.exceptions"]
forbidden_modules = [
    "backend.domain.*.value_objects",
    "backend.domain.*.entities",
    "backend.domain.*.repositories",
    "backend.domain.*.services",
]
as_packages = false

[[tool.importlinter.contracts]]
name = "Domain value objects do not depend on entities, repositories, or services"
type = "forbidden"
source_modules = ["backend.domain.*.value_objects"]
forbidden_modules = [
    "backend.domain.*.entities",
    "backend.domain.*.repositories",
    "backend.domain.*.services",
]
as_packages = false

[[tool.importlinter.contracts]]
name = "Domain entities do not depend on repositories or services"
type = "forbidden"
source_modules = ["backend.domain.*.entities"]
forbidden_modules = [
    "backend.domain.*.repositories",
    "backend.domain.*.services",
]
as_packages = false
ignore_imports = [
    "backend.domain.*.entities -> backend.domain.shared.services",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Domain repositories do not depend on services"
type = "forbidden"
source_modules = ["backend.domain.*.repositories"]
forbidden_modules = [
    "backend.domain.*.services",
]
as_packages = false
ignore_imports = [
    "backend.domain.*.entities -> backend.domain.shared.services",
    "backend.domain.*.repositories -> backend.domain.shared.services",
]
unmatched_ignore_imports_alerting = "none"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TID251", # flake8-tidy-imports banned-api
    "RUF012", # mutable class default
    "RUF100", # unused noqa
]
ignore = [
    "E501", # Line length (handled by ruff format)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TID251"]
"backend/tests/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api."dataclasses.asdict"]
msg = "公開JSONや辞書への変換に dataclasses.asdict() は使用せず、明示的なマッパーまたは .value 変換を使用してください。"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true
explicit_package_bases = true
disable_error_code = ["no-redef"]

[[tool.mypy.overrides]]
module = "janome.*"
ignore_missing_imports = true

