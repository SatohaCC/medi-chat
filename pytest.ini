[pytest]
pythonpath = .
testpaths = backend/tests scripts/hooks
norecursedirs = backend/tests/architecture
asyncio_default_fixture_loop_scope = function
markers =
    postgres: requires the explicitly configured real PostgreSQL test database
    source_data: requires untracked PMDA originals or generated source artifacts
filterwarnings =
    ignore::DeprecationWarning:google.genai.types
