name: Synthetic PostgreSQL contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  postgres-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-ephemeral
          POSTGRES_DB: postgres
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONUTF8: "1"
      PYTHON_DOTENV_DISABLED: "1"
      TEST_DATABASE_URL: postgresql+psycopg://medi_chat_owner:ci-owner-ephemeral@127.0.0.1:15432/medi_chat_test
      TEST_RUNTIME_DATABASE_URL: postgresql+psycopg://medi_chat_app:ci-runtime-ephemeral@127.0.0.1:15432/medi_chat_test
      MEDI_CHAT_DATABASE_URL: postgresql+psycopg://medi_chat_app:ci-runtime-ephemeral@127.0.0.1:15432/medi_chat_test
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      TYPESAFE_API_KEY: ""
      JEV_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.9"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project backend --locked
      - name: Backend tests, architecture, lint, formatting and types
        run: pnpm quality:backend
      - name: Development tooling and generated contracts
        run: pnpm quality:scripts
      - run: node --experimental-strip-types --test frontend/shared/api/authentication.test.mjs
      - name: Initialize this job's disposable service with separated roles
        env:
          POSTGRES_USER: postgres
          POSTGRES_OWNER_PASSWORD: ci-owner-ephemeral
          POSTGRES_RUNTIME_PASSWORD: ci-runtime-ephemeral
        run: |
          bash -n scripts/postgres/init.sh
          docker exec -i \
            -e POSTGRES_USER -e POSTGRES_OWNER_PASSWORD -e POSTGRES_RUNTIME_PASSWORD \
            '${{ job.services.postgres.id }}' bash < scripts/postgres/init.sh
      - name: All real PostgreSQL tests using synthetic source data
        run: pnpm test:postgres -q
