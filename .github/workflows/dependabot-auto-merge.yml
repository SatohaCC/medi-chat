name: Auto-merge Dependabot patches

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Use trusted base-branch configuration; never check out or execute PR code.
      - name: Read Dependabot update metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # A dedicated App preserves closed/push events for downstream workflows.
      - name: Create merge App token
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        id: merge-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.DEPENDABOT_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_MERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Require CI protection and enable auto-merge for patches
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Without required checks, --auto can merge immediately before CI runs.
          protection=$(gh api graphql -F owner="${GH_REPO%/*}" -F name="${GH_REPO#*/}" -f query='
            query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                ref(qualifiedName: "refs/heads/main") {
                  branchProtectionRule {
                    requiresStatusChecks
                    requiredStatusCheckContexts
                  }
                }
              }
            }')
          if ! jq -e '.data.repository.ref.branchProtectionRule |
            .requiresStatusChecks == true and
            (.requiredStatusCheckContexts | index("postgres-contracts") != null)' <<< "$protection" > /dev/null; then
            echo "::error::Require postgres-contracts in main branch protection before enabling patch auto-merge."
            exit 1
          fi
          gh pr merge --auto --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
