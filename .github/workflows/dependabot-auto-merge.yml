name: Auto-merge Dependabot patches

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      # Use trusted base-branch configuration; never check out or execute PR code.
      - name: Read Dependabot update metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for checks and merge patches
        id: merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Protection is enforced by GitHub when merging. Reading its settings
          # requires administration access that GITHUB_TOKEN does not provide.
          # Merge in this run so follow-up jobs do not depend on suppressed events.
          for attempt in {1..60}; do
            pr=$(gh pr view "$PR_URL" --json headRefOid,state,isDraft,statusCheckRollup)
            # Do not wait for this automation's own in-progress/queued jobs.
            pr=$(jq '.statusCheckRollup |= map(select(.name != "auto-merge" and ((.name // "") | startswith("cleanup-preview") or startswith("validate-main") | not)))' <<< "$pr")
            if ! jq -e --arg sha "$PR_HEAD_SHA" '.headRefOid == $sha and .state == "OPEN" and .isDraft == false' <<< "$pr" > /dev/null; then
              echo "::notice::PR is closed, a draft, or its head changed; no merge."
              exit 0
            fi
            if jq -e '.statusCheckRollup | any(.conclusion == "FAILURE" or .conclusion == "CANCELLED" or .conclusion == "TIMED_OUT" or .conclusion == "ACTION_REQUIRED" or .conclusion == "STARTUP_FAILURE" or .state == "FAILURE" or .state == "ERROR")' <<< "$pr" > /dev/null; then
              echo "::error::A PR check failed; no merge."
              exit 1
            fi
            if jq -e '.statusCheckRollup |
              any(.name == "postgres-contracts" and .status == "COMPLETED" and .conclusion == "SUCCESS") and
              all((.status == "COMPLETED" and (.conclusion == "SUCCESS" or .conclusion == "SKIPPED" or .conclusion == "NEUTRAL")) or .state == "SUCCESS")' <<< "$pr" > /dev/null; then
              gh pr merge --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
              echo "merged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "::error::Checks did not pass within 30 minutes; rerun this workflow after resolving CI."
          exit 1

  validate-main:
    needs: auto-merge
    if: always() && needs.auto-merge.outputs.merged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run main CI after the token-authenticated merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run postgres-contracts.yml --ref main

  cleanup-preview:
    needs: auto-merge
    if: always() && needs.auto-merge.outputs.merged == 'true'
    uses: ./.github/workflows/neon-preview-cleanup.yml
    with:
      pr-number: ${{ format('{0}', github.event.pull_request.number) }}
      head-ref: ${{ github.event.pull_request.head.ref }}
    secrets: inherit
