name: Dependabot workflow read access

on:
  pull_request:
    paths:
      - .github/workflows/dependabot-auto-merge.yml
      - .github/workflows/dependabot-workflow-check.yml

permissions: {}

jobs:
  check-read-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      # Exercise the merge workflow's read API with the actual restricted token.
      # No checkout, secrets, admin access, or merge operations are needed.
      - name: Read PR checks and commit statuses
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr view "$PR_URL" --json headRefOid,state,isDraft,statusCheckRollup > /dev/null
